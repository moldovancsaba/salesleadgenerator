<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sales Lead Generator — Capture</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; width: 320px; padding: 16px;
      background: #0f172a; color: #f8fafc;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #1e293b;
    }
    .brand-title { font-size: 13px; font-weight: 700; color: #38bdf8; }
    .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #1e293b; color: #94a3b8; }
    .status-badge.connected { color: #4ade80; }
    .status-badge.unconfigured { color: #94a3b8; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #94a3b8; margin: 10px 0 4px; }
    input, select {
      width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px;
      border: 1px solid #334155; background: #1e293b; color: #f8fafc;
      font: inherit; outline: none;
    }
    input:focus, select:focus { border-color: #38bdf8; }
    button {
      width: 100%; margin-top: 12px; padding: 10px; border-radius: 6px; cursor: pointer;
      border: none; color: #ffffff; font-weight: 600; font: inherit;
      background: #0284c7; transition: background 0.15s ease;
    }
    button:hover { background: #0369a1; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary {
      background: #1e293b; border: 1px solid #334155; color: #94a3b8; margin-top: 8px; font-weight: 500;
    }
    button.secondary:hover { background: #334155; color: #f8fafc; }
    .msg { margin-top: 10px; font-size: 12px; word-break: break-word; line-height: 1.4; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .info { color: #94a3b8; }
    details { margin-top: 14px; border-top: 1px solid #1e293b; padding-top: 8px; }
    summary { color: #94a3b8; font-size: 11px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-title">Sales Lead Generator</div>
    <div class="status-badge" id="status-badge">Ready</div>
  </div>

  <div id="capture-section">
    <label for="brand">Target Brand Workspace</label>
    <select id="brand">
      <option value="cogmap">Cogmap</option>
      <option value="seyu">Seyu</option>
      <option value="dvsc">DVSC</option>
    </select>

    <button id="capture-btn">Capture LinkedIn Profile</button>
  </div>

  <div class="msg" id="msg"></div>

  <details id="settings-details">
    <summary>Connection Settings</summary>
    <label for="baseUrl">CRM Server URL</label>
    <input type="url" id="baseUrl" placeholder="https://salesleadgenerator.vercel.app" />

    <label for="apiKey">API Key (or Token)</label>
    <input type="password" id="apiKey" placeholder="slg_..." />

    <button id="save-btn" class="secondary">Save & Test Connection</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
